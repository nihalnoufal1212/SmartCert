<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>SmartCert — Certificate Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#dashboard" aria-label="SmartCert dashboard">
      <span class="brand-mark">S</span><span class="brand-copy"><b>SMARTCERT</b><small>Certificate automation</small></span>
    </a>
    <div class="workspace-label">WORKSPACE</div>
    <nav class="nav" aria-label="Main navigation">
      <a href="#dashboard" data-page="dashboard"><span class="nav-icon">⌂</span>Dashboard</a>
      <a href="#generate" data-page="generate"><span class="nav-icon">✦</span>Generate certificates</a>
      <a href="#participants" data-page="participants"><span class="nav-icon">♙</span>Participants</a>
      <a href="#templates" data-page="templates"><span class="nav-icon">▧</span>Templates</a>
      <a href="#history" data-page="history"><span class="nav-icon">◷</span>Batch history</a>
    </nav>
    <div class="sidebar-bottom">
      <div class="workspace-card"><span class="workspace-orb">✦</span><div><b id="sidebarOrg">Your organization</b><small>Workspace</small></div><span class="dots">···</span></div>
      <a href="#settings" data-page="settings"><span class="nav-icon">⚙</span>Settings</a>
      <div class="profile"><div class="avatar">N</div><div class="profile-copy"><b id="profileName">Workspace Admin</b><small>Administrator</small></div><span class="dots">⌄</span></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
      <div class="breadcrumbs"><span>Workspace</span><span class="crumb-slash">/</span><b id="crumbTitle">Dashboard</b></div>
      <div class="top-actions"><div class="system-status"><i></i> Prototype ready</div><button class="icon-btn" id="themeToggle" title="Toggle theme">☼</button><div class="avatar small-avatar">N</div></div>
    </header>
    <div id="pageContent" class="page-content" aria-live="polite"></div>
    <div id="toast" class="toast" role="status"></div>
  </main>
</div>
<template id="certificateTemplate">
  <div class="certificate" id="certificate">
    <div class="certificate-inner">
      <div class="cert-org" id="certOrg">SMARTCERT</div>
      <div class="cert-kicker">CERTIFICATE OF RECOGNITION</div>
      <h2 id="certAward">Certificate of Participation</h2>
      <p class="cert-presented">This certificate is proudly presented to</p>
      <div class="cert-person" id="certPerson">Alex Morgan</div>
      <p class="cert-description">In recognition of participation in<br><strong id="certEvent">Innovation &amp; Technology Workshop</strong></p>
      <div class="cert-seal">✓</div>
      <div class="cert-bottom"><span id="certDate">23 October 2026</span><span id="certId">ID: SC-DEMO-001</span><span id="certSign">Organising Committee</span></div>
      <canvas id="certQr" width="120" height="120"></canvas>
    </div>
  </div>
</template>
</body>
</html>
